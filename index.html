<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Temporary two-question digital scratch paper for exams.">
  <title>Digital Exam Scratch Paper</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="site-header">
    <div class="brand-block">
      <h1>Digital Scratch Paper</h1>
      <p>Temporary exam workspace. Work disappears when this page is closed or refreshed.</p>
    </div>

    <nav class="question-tabs" aria-label="Exam problem scratchpads">
      <button type="button" class="question-tab active" data-question="q1" aria-selected="true">Question 1</button>
      <button type="button" class="question-tab" data-question="q2" aria-selected="false">Question 2</button>
    </nav>

    <button id="downloadAll" class="primary-button" type="button">Download Work</button>
  </header>

  <main id="app" aria-live="polite"></main>

  <div id="dialogLayer" class="dialog-layer" hidden></div>

  <script src="app.js"></script>
</body>
</html>
